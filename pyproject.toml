[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitai"
version = "0.5.0"
description = "The AI health coach you own: plain-text record, deterministic engine, skill-driven intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wombat164" }]
keywords = ["health", "fitness", "nutrition", "running", "quantified-self", "llm", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Wombat164/vitai"

[project.scripts]
vitai = "vitai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitai = ["templates/*", "templates/**/*", "semantics/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so local and CI ruff versions agree on the rule set.
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
