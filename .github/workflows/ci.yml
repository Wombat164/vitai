name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests
      - name: Personal-content gate (blocking)
        run: python scripts/personal_gate.py

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q

  demo:
    # "Demo or it didn't happen": the committed demo data must match the
    # generator (determinism) and must build into a rollup with real markers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python examples/generate_demo.py --check
      - run: vitai validate --root examples/demo
      # Built as of the synthetic athlete's last day so the date-sensitive
      # sections (gates, escalations) render what the demo is meant to show.
      - run: vitai build --root examples/demo --on 2030-06-30
      - name: Assert the rollup renders real content
        run: |
          grep -q "ON TARGET" examples/demo/derived/weekly.md
          grep -q "Tripwires" examples/demo/derived/weekly.md
          vitai verdicts --root examples/demo | grep -q '"verdict": "on_target"'
      - name: Assert the safety layer renders a live gate and a closed episode
        run: |
          grep -q "## Gates" examples/demo/derived/weekly.md
          grep -q "impact blocked" examples/demo/derived/weekly.md
          # the 28th is the day the hop test FAILS, so the gate reads plainly
          # blocked; on the 30th it reads "blocks (check not done)"
          vitai safety --root examples/demo --on 2030-06-28 | grep -q "blocks impact"
          # all three precondition states render, including the one that matters:
          # a check nobody did is not a pass
          vitai safety --root examples/demo --on 2030-06-30 | grep -q "check not done"
          vitai safety --root examples/demo --on 2030-06-29 | grep -q "LIFTED today"
          vitai safety --root examples/demo --on 2030-06-28 | grep -q "hop-test.: fail"
          # the calf episode is resolved and must NOT gate at the end of the block
          test "$(vitai safety --root examples/demo --on 2030-06-30 \
            | grep -c 'calf')" = "0"
