name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      # EVERYTHING, not `src tests`. The narrower scope let a line sit over the
      # limit in `examples/` while CI reported the repo clean, so the lint said
      # something true about two directories and was read as a fact about the
      # repo. Widening cost exactly one line to fix, which is the argument for
      # doing it now rather than after the untended directories have grown.
      - run: ruff check .
      - name: Personal-content gate (blocking)
        run: python scripts/personal_gate.py
      - name: Medical-boundary gate (blocking)
        run: python scripts/boundary_gate.py
      - name: Contract-literal gate (blocking)
        run: python scripts/contract_literal_gate.py
      - name: Dependency gate (blocking)
        run: python scripts/dependency_gate.py

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      # THE SUITE MUST NOT WRITE TO THE RECORD IT READS (#322).
      #
      # `tests/test_sensitive_tiers.py` sweeps every public method on `Vitai`,
      # enumerated from the class rather than from a roster - deliberately, so
      # a method added tomorrow is covered without anyone remembering it. The
      # cost of that is that a method added tomorrow is also CALLED, and #318
      # added `pin_policy()`, a writer. The sweep pointed at `examples/demo`
      # appended four dated threshold rows to the shipped fixture on every
      # suite run.
      #
      # It escaped the repo. A downstream consumer emitting a build artifact
      # from `examples/demo` after running the suite got seven thresholds
      # where a fresh clone got three, so its committed output stopped
      # reproducing - which is where this was found, in another repo's CI
      # rather than in this one.
      #
      # #319 fixed the sweep by copying the corpus first. This is the part
      # that keeps it fixed: the next writer on the public API cannot
      # reintroduce it silently, because the suite leaving a tracked file
      # modified is now a red build rather than a thing somebody notices
      # weeks later.
      - name: the suite left the working tree clean
        run: git diff --exit-code

  demo:
    # "Demo or it didn't happen": the committed demo data must match the
    # generator (determinism) and must build into a rollup with real markers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python examples/generate_demo.py --check
      - run: vitai validate --root examples/demo
      # Built as of the synthetic athlete's last day so the date-sensitive
      # sections (gates, escalations) render what the demo is meant to show.
      - run: vitai build --root examples/demo --on 2030-06-30
      - name: Assert the rollup renders real content
        run: |
          grep -q "\*\*Rate:\*\*" examples/demo/derived/weekly.md
          grep -q "Tripwires" examples/demo/derived/weekly.md
          # The happy path still has to work. It moved off the rollup's rate
          # line, which now demonstrates the timing artifact (#37), so it is
          # asserted where it still lives: the weeks with a consistent
          # weigh-in routine score normally in the machine contract.
          vitai verdicts --root examples/demo | grep -q '"verdict": "on_target"'
      - name: Assert a rate the weigh-in times cannot support is not scored
        run: |
          # #37: the demo's routine falls apart after the travel week, so the
          # current rate spans ~12 h of weigh-in times - enough diurnal drift
          # to account for the whole number. The rollup must decline to judge
          # it and say why, and the machine contract must not emit a verdict
          # a consumer would render as fact.
          grep -q "NOT READABLE" examples/demo/derived/weekly.md
          grep -q "not yet separable from weigh-in timing" examples/demo/derived/weekly.md
          vitai verdicts --root examples/demo | grep -q '"metric": "weight_rate", .*"verdict": "no_data"'
      - name: Assert the safety layer renders a live gate and a closed episode
        run: |
          grep -q "## Gates" examples/demo/derived/weekly.md
          grep -q "impact blocked" examples/demo/derived/weekly.md
          # the 28th is the day the hop test FAILS, so the gate reads plainly
          # blocked; on the 30th it reads "blocks (check not done)"
          vitai safety --root examples/demo --on 2030-06-28 | grep -q "blocks impact"
          # all three precondition states render, including the one that matters:
          # a check nobody did is not a pass
          vitai safety --root examples/demo --on 2030-06-30 | grep -q "check not done"
          vitai safety --root examples/demo --on 2030-06-29 | grep -q "LIFTED today"
          vitai safety --root examples/demo --on 2030-06-28 | grep -q "hop-test.: fail"
          # the calf episode is resolved and must NOT gate at the end of the block
          test "$(vitai safety --root examples/demo --on 2030-06-30 \
            | grep -c 'calf')" = "0"
