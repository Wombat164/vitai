name: release

# Cut a release by pushing a vX.Y.Z tag. The build job always runs and
# validates the distribution; the PyPI publish job is SKIPPED unless the
# repository variable PYPI_ENABLE is set to "true" (keeps releases green
# until the PyPI name is claimed). Publishing uses Trusted Publishing
# (OIDC) - no stored token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-release.txt
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_ENABLE == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # SHA-PINNED like every other action here (#416). `release/v1` is a
      # MOVING tag: the publisher repoints it, so what runs at release
      # time is decided by somebody else, after the tag was cut, in the
      # one job that holds an OIDC token.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
