# vitai thresholds - YOUR numbers, not the tool's.
# Every entry is optional: an absent threshold disables its verdict/tripwire.
#
# These are STARTING values. Once you change a threshold, record the change in
# data/thresholds.jsonl instead of editing it here: a dated line keeps the old
# number in force for the weeks it governed, so last month's verdicts stay as
# they were judged. Editing this file re-scores nothing that already has a
# dated line, but a threshold that lives ONLY here has no history to protect
# it. Calorie and macro targets have no home here at all - they belong in
# thresholds.jsonl (kcal_target, protein_g_target), because they move often
# enough that an undated one would quietly rewrite the past.

[targets]
# Rate-of-loss phases: [from_kg, to_kg, kg_per_week], evaluated in order.
# Standard guidance is 0.5-1.0% of bodyweight per week; taper as you get lighter.
# phases = [[80.0, 76.0, 0.70], [76.0, 73.0, 0.50]]

[tripwires]
# easy_hr_cap = 150      # avg HR cap for easy runs (Z2 discipline flag)
# rhr_baseline = 52      # resting HR baseline; alert at baseline + 5
# steps_floor = 10000    # 7-day average daily-steps floor
# sleep_floor_h = 7.0    # 7-day average sleep floor
# pain_gate = 3          # pain score (0-10) above which the gate fires

# [preferences]
# suppressed_metrics = []  # metrics to LEAVE ALONE: still recorded, never
#                          # scored. Use this rather than deleting history
#                          # when a number is not healthy to be judged on.
# rollup_weeks = 12       # weeks of the training table the rollup prints (0 = all)
# nudge_ok = false         # may the coach interrupt proactively at all?
# intake_buffer_pct = 15   # margin on ESTIMATED meal intake (#96).
#                          # Under-counting intake stalls a deficit while
#                          # looking like adherence. Set it here so it
#                          # applies to every estimate or to none - a
#                          # buffer used on some meals and not others
#                          # corrupts every comparison in the series.

# [resolution]           # Only needed once a SECOND source appears.
# source_order = ["scale", "watch", "app"]   # fallback ladder
# [resolution.precedence]                    # per-quantity overrides
# kcal_out = ["watch", "app"]   # the watch measures burn; the app models it
# kcal_in = ["app"]             # the food ledger owns intake
# steps = ["watch", "phone"]
#
# Storage is SI and display converts at the edge: kilograms, kilometres,
# seconds, grams go in the record whatever units the athlete reads them in.
# A record that stores what a screen happened to show cannot be compared
# with itself after a device changes locale.

# [device]                # Only needed once a SECOND device appears (#105).
# slug = "laptop"          # THIS machine's name, set here BEFORE a second
#                          # device ever writes - lowercase letters, digits
#                          # and hyphens, up to 32 characters.
#
# Unset, every append lands in data/<dataset>.jsonl - correct for a
# single-device record, which is what every existing record already is. The
# moment a second machine starts from this same template, it appends to that
# identical plain file too: two writers, one file, and a sync client
# resolving that by last-writer-wins or a `conflicted copy` silently drops
# one device's rows. Set a slug per device instead and appends land in
# data/<dataset>.<slug>.jsonl, so no two devices ever write the same file -
# see devices.py for why that makes a conflict structurally impossible
# rather than merely resolved.

# [inference]            # OPT-IN intelligence layer for `vitai infer`:
                         # a model reads the record and appends validated
                         # knowledge to data/inferences.jsonl. Never feeds
                         # the deterministic number path.
# backend = "claude-cli"           # uses your authenticated Claude Code CLI
# model = ""                       # optional model override
# --- or any OpenAI-compatible endpoint (Ollama, llama.cpp, LiteLLM): ---
# backend = "openai-compatible"
# base_url = "http://localhost:11434"
# model = "qwen3:8b"
# api_key_env = ""                 # env var NAME holding the key, if any
# max_items = 5
