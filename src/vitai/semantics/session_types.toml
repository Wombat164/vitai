# --- retired ------------------------------------------------------------------
# Legal forever - an old line is history, not an error - no longer offered,
# and resolved forward.

[retired.gym_a]
maps_to = "strength"
since_gen = 2
reason = "one athlete's programme label (Strength A) in a public engine"

[retired.gym_b]
maps_to = "strength"
since_gen = 2
reason = "one athlete's programme label (Strength B) in a public engine"

[retired.virtual_run]
aliases = ["VirtualRun"]
maps_to = "run"
since_gen = 3
reason = "Strava VirtualRun pre-coordinates activity with modality; write run + setting=virtual"

[retired.virtual_ride]
aliases = ["VirtualRide"]
maps_to = "cycle"
since_gen = 3
reason = "Strava VirtualRide pre-coordinates activity with modality; write cycle + setting=virtual"

[retired.virtual_row]
