# Session types - the ACTIVITY axis, and only the activity axis.
#
# WHAT WAS WRONG, twice. First (#18) this shipped `gym_a` and `gym_b` - one
# athlete's programme labels - in a public engine. Then the vocabulary proved
# too COARSE: importing 1,502 real activities put 436 of them (29%) into
# `other`, because thirteen broad categories cannot express `Outdoor Bike`,
# `Elliptical Trainer` or `Running (jogging), 9 mph`.
#
# THE PRIOR ART, and it is not hand-assembled. Strava's `SportType` is exactly
# 50 values - a maintained, consumer-grade taxonomy that covers the field.
# Apple HealthKit's `HKWorkoutActivityType` (~80 values) is a superset and is
# recorded per type as `healthkit`, so an Apple Health import maps outward
# rather than needing its own vocabulary. The Compendium of Physical
# Activities remains the academic grounding for energy, cited as `compendium`
# at major-heading level where the mapping is clean and left BLANK where it is
# not - guessing a code is worse than shipping none.
#
# 47 OF THE 50 ARE ADOPTED AS VALUES. Three are not, deliberately:
# `VirtualRun`, `VirtualRide` and `VirtualRow` pre-coordinate an activity with
# a modality, which is the exact defect this file exists to avoid. They are
# expressed as the activity plus `setting = "virtual"` (see settings.toml),
# and are listed in [retired] so an import naming them still resolves.
#
# The same applies to the catchalls the athlete asked for. `outdoor_other` is
# not an activity - it is `other` plus `setting = "outdoor"`. Polar ships
# `OTHER_OUTDOOR` and `OTHER_INDOOR` as single tokens and Strava ships the
# Virtual trio; both pre-coordinate, and copying either would multiply this
# registry by the size of the setting axis instead of adding one field.
#
# LEGACY COARSE VALUES ARE KEPT, NOT RETIRED. `wintersport`, `sport`, `paddle`
# and `mobility` predate this expansion and have no single defensible target -
# `wintersport` is not AlpineSki any more than it is Snowboard. Retiring them
# would need a mapping nobody can defend, so they stay legal and an athlete
# who only knows "some winter sport" can still say so.
#
# EXTENDING IT: an athlete-defined activity is a first-class value here, added
# as a curated entry. It must NEVER be fuzzy-matched into one of the canonical
# 47 - a matcher that turns "Running (jogging), 9 mph" into `run` will also
# turn something else into `run` silently, and nobody will find out. Aliases
# are curated data; nothing guesses at import time.
#
# `classes` names the restriction classes a session of this type falls under,
# which is what gates match against. It lives here rather than in safety.py so
# adding a sport does not mean editing the safety layer.

version = 2

# Fields whose values are also accepted spellings (see vocab._index).
alias_fields = ["strava", "healthkit"]


# --- the adopted Strava SportType axis ---------------------------------------

[types.run]
label = "Run"
strava = "Run"
healthkit = "HKWorkoutActivityTypeRunning"
compendium = 12
classes = ["run", "impact", "cardio", "lower_body"]
aliases = ["running", "jog", "jogging", "running (jogging), 9 mph (6.5 min mile) (myfitnesspal)", "running (jogging), 5 mph (12 min mile) (myfitnesspal)", "running (jogging), 6 mph (10 min mile) (myfitnesspal)"]

