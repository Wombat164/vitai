# Exercises - the MOVEMENT axis, reusing the axes that already exist.
#
# The rule, and it is the whole design: `pattern`, `load` and `plane` come
# from restrictions.toml, and `region` from body_sites.toml. Inventing a
# second movement taxonomy or a second anatomy here would be the body-sites
# mistake in a new place, and it would make the two unjoinable - which is
# exactly the defect this registry exists to fix.
#
# WHAT WAS WRONG. `sets.exercise` was free text, so `push-up`, `pushup` and
# `press-up` were three exercises and no query grouped them. Worse, a
# restriction could not see a set at all: an episode wanted `pattern=hinge
# region=hip load=loaded` and had nothing to match against, so the coarse
# `restricts: strength` gate was used instead - and it blocked push-ups,
# which is collateral damage caused precisely by the precise gate having
# nothing to check. Give exercises the axes and a set INHERITS them.
#
# PRIOR ART AND LICENCE. Seeded from free-exercise-db, which is the Unlicense
# - public domain, no attribution obligation, safe to vendor into an MIT
# engine. `source` records that per entry. wger is deliberately NOT used:
# its code is AGPL and, more to the point here, its exercise DATA is CC-BY-SA,
# so copying entries from it would bind this file's licence. It is readable as
# a cross-check and nothing from it lands here. Anything invented locally is
# marked `source = "curated"`.
#
# POST-COORDINATION IS THE POINT. `incline_dumbbell_bench_press` is never an
# entry. It is `bench-press` plus `equipment = dumbbell` plus
# `angle_class = incline` (#99). FIT's hundreds of fused enum values are the
# cautionary counter-example: a vocabulary that pre-coordinates multiplies by
# the size of every axis it folds in, and then cannot answer a question about
# any single one of them.
#
# `region` IS A LIST, and it is body SITES rather than muscles. A push-up
# loads chest, shoulder and upper arm; forcing a single value would make the
# file assert a primary mover, which is a modelling claim this record cannot
# defend. Per-muscle attribution is ruled out for the same reason.
#
# `load` IS THE EXERCISE'S DEFAULT. A weighted push-up is still `push-up` -
# the set's own `load_type` says it was loaded, and a restriction check reads
# the SET's load_type when present and this default only when it is not.
#
# `fit` is the FIT exercise-name token, resolving as an alias the same way
# `strava` and `healthkit` do in session_types.toml. It is what lets a FIT
# import (#101) map inward without a translation table of its own.
#
# AN UNKNOWN EXERCISE HAS NO AXES, so a restriction check against it can
# neither pass nor fail and must report that it was not evaluated. A missing
# gate is the failure mode that matters: the athlete trains on an injury
# nobody flagged.
#
# WHAT IS DELIBERATELY MISSING. `restrictions.toml` has no abduction or
# adduction pattern (#58 owns adding them), so lateral raises, hip abduction
# and hip adduction are NOT here. Every available value is wrong for them:
# `push` over-blocks a lateral raise under a pressing restriction, `rotate`
# blocks an abductor machine under a rotational one. Left out, they resolve to
# `unknown` and a gate against them ABSTAINS - which is loud, recoverable, and
# what this file's own doctrine requires. They land when #58 does.
#
# EXTENDING IT: add a curated entry with its aliases. Nothing is fuzzy-matched
# at import time. This is the world's gym catalogue, never one athlete's
# programme - the `gym_a`/`gym_b` lesson (G85).

# A LIMIT THIS ANNOTATION HAS, recorded rather than papered over. Some
# requirements depend on the IMPLEMENT rather than the movement, and the
# implement is post-coordinated on the set. A barbell back squat needs a rack
# to unrack from; a goblet squat with the same registry slug needs nothing but
# the weight. So `squat` carries `kit = ["load-implement"]` and no fixture,
# which is honest and incomplete: the rack requirement belongs to the
# barbell-squat COMBINATION, not to the movement.
#
# Resolving it properly means requirements on (exercise x equipment) pairs.
# That is a real extension and not this change. Until then a consumer matching
# against a place must treat a loaded movement's fixture list as a floor rather
# than a total.

version = 1

# Fields whose values are also accepted spellings (see vocab._index).
alias_fields = ["fit"]

# Empty from day one, and present from day one: a value that stops being
# current resolves FORWARD rather than becoming unreadable, so a record
# written before a rename still loads. See vocab.py.
[retired]

