# What each contract TOUCHED, so a client can answer "do I need to move"
# without a human reading prose. #451, from the measurement in #450.
#
# THERE IS NO "does a client need to move" FIELD HERE, deliberately. That
# question has one safe answer, `yes`, which is never wrong and costs the
# author nothing, so a field shaped like it converges on `yes` and stops
# carrying information. The engine states WHAT it touched; the client
# intersects that with what it reads and derives its own answer.
#
# A single yes/no could not carry contract 48 anyway. Its migration row says
# "No column moved" AND that a client matching `kind` exhaustively silently
# drops every `band` row. Both are true, they answer different questions, and
# a boolean forces the author to pick one.
#
# SURFACE GRAMMAR. Three forms, because they have three different audiences
# and a client knows which one it is:
#
#   table, table.column   the built read model (`derived/health.db`). The
#                         audience is a READER. Resolves against the demo build.
#   meta:field            a line-level field on the append shape, never a
#                         column. The audience is an AUTHOR of lines.
#                         Resolves against `schema.META_KEYS`.
#   report:name[.field]   a surface that reaches consumers through the report
#                         and is NOT a table. The audience is a reader of the
#                         report. A client gating on the SQLite shape may
#                         ignore every one of these outright.
#                         Resolves against a public `Vitai` method or
#                         property - a `property` is not `callable()`, and
#                         asking that rejected `report:policy`, which a real
#                         client reads and this engine really publishes.
#
# THE FOURTH GRAMMAR IS NOT FOR THIS FILE (#453). `payload:key[.name]` names
# what `api.schema()` publishes - `fields`, `session_types`, the `aliases`,
# `units` and `display_name` a client renders. NO CONTRACT ROW MAY USE IT, and
# a test refuses one that does, because the payload does not move with the
# contract number: #350 moved eight aliases out of it, #331 added
# `display_name` to it, #400 moved six words in it, none of them with a bump
# and all of them right - making a vocabulary fix a migration rebuilds the
# treadmill #450 measured. The grammar exists so a CLIENT can say it reads the
# payload and be told, in the same verdict, that the contract cannot answer
# for it and `payload_digest` can.
#
# A CONDITION ON A ROW (#464). `unless = "<name>"` says the change is real for
# some records and not others. Contract 54 is the case: what narrowed is a
# CONTESTED position, and a position can only be contested where two machines
# wrote it, so a single-writer record is unaffected - which its own migration
# note says and the surface table said the opposite of for seventy lines.
#
# IT NEVER SOFTENS THE VERDICT BY ITSELF. The row keeps forcing a move until
# the condition has been evaluated against a real record, because "does not
# apply to you" is the answer that costs a CLIENT nothing and is the mirror of
# the `yes` this file has no field for. Names resolve against
# `contracts.CONDITIONS`, each of which is a public read on `Vitai` plus a
# predicate over its answer, so the vocabulary cannot grow into prose.
#
# CHANGE KINDS. Three, closed, each with a mechanical consequence rather than
# a description. `retired` and `meaning` were drafted and dropped because
# nothing between 47 and 54 exercises them, and an unused member of a closed
# vocabulary is the vacuity this repo already gates on elsewhere. The contract
# that needs one adds it.
#
#   added      a new table, column or field. A READER NEED NOT MOVE; adopting
#              it is a choice.
#   widened    a closed vocabulary gained a member. A READER THAT MATCHES
#              EXHAUSTIVELY MUST MOVE, or it silently drops rows.
#   narrowed   a value that was always present may now be absent or refused.
#              A READER MUST MOVE.
#
# THE FLOOR IS 47 and the API refuses below it rather than answering partially.
# Backfilling 46 contracts by re-reading prose is the "somebody fills in a
# field" failure this file exists to prevent, and a wrong backfilled entry is
# worse than an absent one because it will be trusted. 47 is where the
# evidence was read commit by commit in #450. Every contract from here must
# declare, and `tests/test_contract_impact.py` enforces it.

[47]
touches = [
  { surface = "crossings", change = "added" },
  { surface = "measurements.kind", change = "widened" },
]

[48]
